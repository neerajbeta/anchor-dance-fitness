name: Azure Static Web Apps CI/CD

# Deployment now runs on Cloudflare Workers (see wrangler.jsonc), so this no
# longer fires on every push — otherwise one push would deploy to two hosts at
# once. Azure is kept as a working fallback: start it by hand from the Actions
# tab ("Run workflow") whenever it's needed.
on:
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_STONE_076817910 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          # This app is Next.js in SSR/hybrid mode (API routes, middleware, DB-backed
          # dynamic pages) — NOT a static export. Leaving output_location empty lets
          # Oryx auto-detect Next.js and build it as a hybrid (SSR) app with managed
          # Azure Functions under the hood, instead of looking for a static "build" folder.
          # Docs: https://learn.microsoft.com/azure/static-web-apps/nextjs-hybrid
          app_location: "/" # App source code path
          api_location: "" # No separate Azure Functions API — routes are inside Next.js
          output_location: "" # Empty = Oryx handles the Next.js hybrid build itself
          ###### End of Repository/Build Configurations ######

# The "close pull request" job that used to live here only made sense while
# this workflow ran on pull_request events, which it no longer does.
