name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_STONE_076817910 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          # This app is Next.js in SSR/hybrid mode (API routes, middleware, DB-backed
          # dynamic pages) — NOT a static export. Leaving output_location empty lets
          # Oryx auto-detect Next.js and build it as a hybrid (SSR) app with managed
          # Azure Functions under the hood, instead of looking for a static "build" folder.
          # Docs: https://learn.microsoft.com/azure/static-web-apps/nextjs-hybrid
          app_location: "/" # App source code path
          api_location: "" # No separate Azure Functions API — routes are inside Next.js
          output_location: "" # Empty = Oryx handles the Next.js hybrid build itself
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_STONE_076817910 }}
          action: "close"
